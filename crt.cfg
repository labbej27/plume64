# Banque 0 de la cartouche : ROML ($8000) puis ROMH ($A000 en mode 16 Ko,
# $E000 en Ultimax). Le demarrage Ultimax occupe les 256 derniers octets de ROMH.
MEMORY {
  ROM:   start = $8000, size = $3F00, fill = yes, fillval = $FF, file = %O;
  ULTI:  start = $FF00, size = $FA, fill = yes, fillval = $FF, file = %O;
  VEC:   start = $FFFA, size = 6, file = %O;
}
SEGMENTS {
  ROML:    load = ROM, type = ro;
  ROMH:    load = ULTI, type = ro;
  VECTORS: load = VEC, type = ro;
}
